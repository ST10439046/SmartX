# Docker Compose stack: runs SQL Server, database bootstrap, the .NET API, and the Nginx-hosted React frontend.
name: smartx

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartx-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (minimum 8 chars, upper/lower/digit/symbol)}
    ports:
      - "${SQLSERVER_PORT:-14330}:1433"
    volumes:
      - smartx-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: smartx-database-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./database/init:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-database.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartx-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SmartIot;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=False;TrustServerCertificate=True;Connect Timeout=30"
    ports:
      - "${API_PORT:-5231}:8080"
    volumes:
      - smartx-attachments:/app/uploads
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartx-frontend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  smartx-sql-data:
  smartx-attachments:
