name: Smart-X CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - .NET 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/SmartIotApi.csproj

      - name: Build backend
        run: dotnet build backend/SmartIotApi.csproj --configuration Release --no-restore

      - name: Run backend tests
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f \( -name '*Tests.csproj' -o -name '*.Tests.csproj' -o -name '*.Test.csproj' \) -not -path '*/obj/*' -not -path '*/bin/*')
          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "No dedicated .NET test projects found yet; backend build validation completed."
          else
            for project in "${test_projects[@]}"; do
              dotnet test "$project" --configuration Release --no-restore
            done
          fi

  frontend:
    name: Frontend - lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
